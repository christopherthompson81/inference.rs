[package]
name = "inference-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Long GPU work queued beside the inference.rs engine: world generation and reconstruction jobs, their records and events"
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
hf-hub.workspace = true
inference-api.workspace = true
inference-json.workspace = true
inference-recon.workspace = true
inference-tensor.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
image.workspace = true
indicatif.workspace = true
inference = { workspace = true, features = ["all-models"] }
inference-models-llama.workspace = true
inference-nn.workspace = true
inference-quant.workspace = true
rand.workspace = true
rand_distr.workspace = true
tempfile.workspace = true

[features]
cuda = ["inference-api/cuda", "inference-recon/cuda", "inference-tensor/cuda"]
metal = ["inference-api/metal", "inference-recon/metal", "inference-tensor/metal"]
