[package]
name = "inference-quant"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT AND Apache-2.0"
homepage.workspace = true

[dependencies]
inference-tensor.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
paste.workspace = true
tracing.workspace = true
indicatif.workspace = true
indexmap.workspace = true
rayon.workspace = true
libc.workspace = true
byteorder.workspace = true
bytemuck.workspace = true
float8.workspace = true
objc2-metal = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
thiserror.workspace = true
yoke.workspace = true
memmap2.workspace = true
safetensors.workspace = true
regex.workspace = true
fancy-regex.workspace = true
tokio.workspace = true
futures.workspace = true
sysinfo.workspace = true
cutile = { workspace = true, optional = true, features = ["experimental-tune"] }
inference-metal-compile = { workspace = true, optional = true, features = ["metal"] }

[features]
cuda = [
    "inference-tensor/cuda",
    "dep:inference-kernel-build"
]
cutile = [
    "cuda",
    "dep:cutile",
]
nccl = ["cuda", "inference-tensor/nccl"]
metal = [
    "inference-tensor/metal",
    "dep:objc2-metal",
    "dep:dispatch2",
    "dep:candle-metal-kernels",
    "dep:inference-metal-compile",
]
accelerate = ["inference-tensor/accelerate"]
ring = []


[build-dependencies]
inference-kernel-build = { workspace = true, optional = true }
inference-metal-compile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "nvfp4_bench"
required-features = ["cuda", "cutile"]
