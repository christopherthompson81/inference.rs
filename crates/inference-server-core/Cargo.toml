[package]
name = "inference-server-core"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["tokio", "multipart"] }
mime.workspace = true
http-body = { workspace = true }
http-body-util.workspace = true
either.workspace = true
futures.workspace = true
inference-api.workspace = true
inference-selection.workspace = true
inference-core = { workspace = true, features = [
  "utoipa",
] }
serde.workspace = true
# The served document keeps docs/openapi.json's key order.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
url.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"], optional = true }
uuid = { workspace = true, features = ["v4"] }


[dev-dependencies]
base64.workspace = true
candle-core.workspace = true
tempfile.workspace = true
candle-nn.workspace = true
indicatif.workspace = true
image.workspace = true
inference-models-other.workspace = true
inference-nn.workspace = true
inference-quant.workspace = true
rand.workspace = true
rand_distr.workspace = true
tower = { workspace = true, features = ["util"] }

[features]
default = ["swagger-ui", "all-models"]
all-models = ["inference-core/all-models", "inference-api/all-models"]
models-gemma = ["inference-core/models-gemma", "inference-api/models-gemma"]
models-llama = ["inference-core/models-llama", "inference-api/models-llama"]
models-other = ["inference-core/models-other", "inference-api/models-other"]
models-phi = ["inference-core/models-phi", "inference-api/models-phi"]
models-qwen = ["inference-core/models-qwen", "inference-api/models-qwen"]
swagger-ui = ["dep:utoipa-swagger-ui"]
cuda = ["inference-core/cuda", "inference-api/cuda"]
cudnn = ["inference-core/cudnn", "inference-api/cudnn"]
metal = ["inference-core/metal", "inference-api/metal"]
flash-attn = ["cuda", "inference-core/flash-attn", "inference-api/flash-attn"]
flash-attn-v3 = ["cuda", "inference-core/flash-attn-v3", "inference-api/flash-attn-v3"]
accelerate = ["inference-core/accelerate", "inference-api/accelerate"]
mkl = ["inference-core/mkl", "inference-api/mkl"]
nccl = ["inference-core/nccl", "inference-api/nccl"]
ring = ["inference-core/ring", "inference-api/ring"]
code-execution = ["inference-core/code-execution", "inference-api/code-execution"]
