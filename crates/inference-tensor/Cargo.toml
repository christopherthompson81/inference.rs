[package]
name = "inference-tensor"
version.workspace = true
# candle's edition
edition = "2021"
rust-version.workspace = true

description = "The tensor layer of inference.rs, derived from candle-core and candle-nn."
repository.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
byteorder = "1.4.3"
inference-tensor-kernels = { path = "../inference-tensor-kernels", optional = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { version = "0.3.1", optional = true }
objc2-foundation = { version = "0.3.1", optional = true }
cudarc = { version = "0.19.8", features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-loading",
], default-features = false, optional = true }
gemm = "0.19.0"
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
libc = "0.2.147"
libm = "0.2.15"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num-traits = "0.2.15"
num_cpus = "1.15.0"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
serde = { version = "1.0.171", features = ["derive"] }
thiserror = "2"
yoke = { version = "0.8.1", features = ["derive"] }
zerocopy = "0.8"
zip = { version = "8.6.0", default-features = false }
parking_lot = "0.12.5"

[features]
default = []
cuda = ["cudarc", "dep:inference-tensor-kernels", "inference-tensor-kernels/cuda"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]
