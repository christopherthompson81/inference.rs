# A tiny Streaming Sortformer: the shipped v2.1 config's shape at toy sizes, with a schedule that fills and
# compresses the speaker cache within a few seconds of audio. Every popped frame counts as silence (the threshold
# passes any four probabilities' sum), so the running silence mean is exercised too.
target: nemo.collections.asr.models.sortformer_diar_models.SortformerEncLabelModel
sample_rate: 16000
max_num_of_spks: 4
preprocessor:
  _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
  normalize: NA
  window_size: 0.025
  sample_rate: 16000
  window_stride: 0.01
  window: hann
  features: 16
  n_fft: 512
  dither: 1.0e-05
sortformer_modules:
  _target_: nemo.collections.asr.modules.sortformer_modules.SortformerModules
  num_spks: 4
  fc_d_model: 16
  tf_d_model: 8
  spkcache_len: 16
  fifo_len: 4
  chunk_len: 6
  spkcache_update_period: 4
  chunk_left_context: 1
  chunk_right_context: 1
  spkcache_sil_frames_per_spk: 1
  pred_score_threshold: 0.25
  scores_boost_latest: 0.05
  sil_threshold: 4.5
  strong_boost_rate: 0.75
  weak_boost_rate: 1.5
  min_pos_scores_rate: 0.5
encoder:
  _target_: nemo.collections.asr.modules.ConformerEncoder
  feat_in: 16
  n_layers: 2
  d_model: 16
  subsampling: dw_striding
  subsampling_factor: 8
  subsampling_conv_channels: 4
  ff_expansion_factor: 2
  self_attention_model: rel_pos
  n_heads: 2
  xscaling: true
  pos_emb_max_len: 5000
  conv_kernel_size: 3
transformer_encoder:
  _target_: nemo.collections.asr.modules.transformer.transformer_encoders.TransformerEncoder
  num_layers: 2
  hidden_size: 8
  inner_size: 16
  num_attention_heads: 2
  hidden_act: relu
  pre_ln: false
