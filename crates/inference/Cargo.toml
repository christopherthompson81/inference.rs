[package]
name = "inference"
readme = "README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mistralrs"

[dependencies]
inference-core.workspace = true
inference-macros.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
image.workspace = true
indexmap.workspace = true
either.workspace = true
futures.workspace = true
reqwest.workspace = true
tracing.workspace = true

[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["all-models"]
all-models = ["inference-core/all-models"]
models-gemma = ["inference-core/models-gemma"]
models-llama = ["inference-core/models-llama"]
models-other = ["inference-core/models-other"]
models-phi = ["inference-core/models-phi"]
models-qwen = ["inference-core/models-qwen"]
# NVIDIA CUDA GPU support
cuda = ["inference-core/cuda"]
cutile = ["cuda", "inference-core/cutile"]
# cuDNN acceleration (requires cuda)
cudnn = ["inference-core/cudnn"]
# Apple Metal GPU support (macOS/iOS)
metal = ["inference-core/metal"]
# Flash Attention 2 kernels (requires cuda)
flash-attn = ["cuda", "inference-core/flash-attn"]
# Apple Accelerate framework for BLAS operations
accelerate = ["inference-core/accelerate"]
# Intel MKL acceleration for BLAS operations
mkl = ["inference-core/mkl"]
# Multi-GPU support via NCCL (requires cuda)
nccl = ["inference-core/nccl"]
# Use ring instead of aws-lc-rs for TLS
ring = ["inference-core/ring"]
# Python code execution tool
code-execution = ["inference-core/code-execution"]
