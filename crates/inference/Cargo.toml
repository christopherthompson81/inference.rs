[package]
name = "inference"
readme = "README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
inference-api.workspace = true
inference-macros.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
image.workspace = true
either.workspace = true
futures.workspace = true
base64.workspace = true
uuid.workspace = true

[dev-dependencies]
inference-tensor.workspace = true
indicatif.workspace = true
inference-models-gemma.workspace = true
inference-models-llama.workspace = true
inference-models-other.workspace = true
inference-models-qwen.workspace = true
inference-nn.workspace = true
inference-quant.workspace = true
rand.workspace = true
rand_distr.workspace = true
tempfile.workspace = true

[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["all-models"]
all-models = ["inference-api/all-models"]
models-gemma = ["inference-api/models-gemma"]
models-llama = ["inference-api/models-llama"]
models-other = ["inference-api/models-other"]
models-phi = ["inference-api/models-phi"]
models-qwen = ["inference-api/models-qwen"]
# NVIDIA CUDA GPU support
cuda = ["inference-api/cuda"]
cutile = ["cuda", "inference-api/cutile"]
# cuDNN for candle's convolutions (requires cuda); slower than the default path, not recommended
cudnn = ["inference-api/cudnn"]
# Apple Metal GPU support (macOS/iOS)
metal = ["inference-api/metal"]
# Apple Accelerate framework for BLAS operations
accelerate = ["inference-api/accelerate"]
# Intel MKL acceleration for BLAS operations
mkl = ["inference-api/mkl"]
# Multi-GPU support via NCCL (requires cuda)
nccl = ["inference-api/nccl"]
# Use ring instead of aws-lc-rs for TLS
ring = ["inference-api/ring"]
# Python code execution tool
code-execution = ["inference-api/code-execution"]
