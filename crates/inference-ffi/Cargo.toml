[package]
name = "inference-ffi"
readme = "README.md"
authors = ["Chris Thompson"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C ABI for inference.rs (libinference_ffi)."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[lib]
name = "inference_ffi"
# rlib so the Rust integration tests can call the exported functions directly
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
image.workspace = true
inference-api = { workspace = true, features = ["all-models"] }
inference-core.workspace = true
inference-layout = { path = "../inference-layout" }
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
candle-nn.workspace = true
indicatif.workspace = true
inference-models-other.workspace = true
inference-nn.workspace = true
inference-quant.workspace = true
rand.workspace = true
rand_distr.workspace = true
tempfile.workspace = true

[features]
cuda = ["candle-core/cuda", "inference-api/cuda", "inference-layout/cuda"]
metal = ["candle-core/metal", "inference-api/metal", "inference-layout/metal"]
