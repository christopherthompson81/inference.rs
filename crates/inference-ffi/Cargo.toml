[package]
name = "inference-ffi"
readme = "README.md"
authors = ["Chris Thompson"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C ABI for inference.rs (libinference_ffi)."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[lib]
name = "inference_ffi"
# rlib so the Rust integration tests can call the exported functions directly
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
inference-tensor.workspace = true
image.workspace = true
inference-api = { workspace = true }
inference-layout = { path = "../inference-layout" }
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
indicatif.workspace = true
inference-models-other.workspace = true
inference-nn.workspace = true
inference-quant.workspace = true
rand.workspace = true
rand_distr.workspace = true
tempfile.workspace = true

[features]
default = ["all-models", "code-execution"]
# Model families; an integrator shipping one family builds with --no-default-features and just that one.
all-models = ["inference-api/all-models"]
models-gemma = ["inference-api/models-gemma"]
models-llama = ["inference-api/models-llama"]
models-other = ["inference-api/models-other"]
models-phi = ["inference-api/models-phi"]
models-qwen = ["inference-api/models-qwen"]
cuda = ["inference-tensor/cuda", "inference-api/cuda", "inference-layout/cuda"]
metal = ["inference-tensor/metal", "inference-api/metal", "inference-layout/metal"]
cutile = ["cuda", "inference-api/cutile"]
cudnn = ["inference-tensor/cudnn", "inference-api/cudnn"]
flash-attn-v3 = ["cuda", "inference-api/flash-attn-v3"]
accelerate = ["inference-api/accelerate"]
mkl = ["inference-api/mkl"]
nccl = ["inference-api/nccl"]
ring = ["inference-api/ring"]
code-execution = ["inference-api/code-execution"]
