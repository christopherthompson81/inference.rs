[package]
name = "inference-paged-attn"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
inference-tensor.workspace = true
half.workspace = true
float8.workspace = true
objc2-metal = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
inference-metal-compile = { workspace = true, optional = true, features = ["metal"] }
thiserror.workspace = true

[build-dependencies]
inference-kernel-build = { workspace = true, optional = true }
anyhow.workspace = true
inference-metal-compile = { workspace = true, optional = true }

[features]
cuda = ["dep:inference-kernel-build", "inference-tensor/cuda"]
metal = [
    "inference-tensor/metal",
    "dep:objc2-metal",
    "dep:dispatch2",
    "dep:candle-metal-kernels",
    "dep:inference-metal-compile",
]
