[package]
name = "inference-nn"
readme = "README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
csv.workspace = true
derive-new.workspace = true
either.workspace = true
float8.workspace = true
half.workspace = true
indexmap.workspace = true
indicatif.workspace = true
inference-flash-attn = { workspace = true, optional = true }
candle-flash-attn-v3 = { workspace = true, optional = true }
inference-paged-attn = { workspace = true, optional = true }
inference-quant.workspace = true
itertools.workspace = true
metrics.workspace = true
num-traits.workspace = true
pyo3 = { workspace = true, optional = true }
rand.workspace = true
rand_isaac.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, features = ["fancy-regex"] }
tqdm.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
objc2-metal = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }

[build-dependencies]
cudaforge = { workspace = true, optional = true }

[features]
pyo3_macros = ["dep:pyo3"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "dep:cudaforge",
    "inference-quant/cuda",
    "dep:inference-paged-attn",
    "inference-paged-attn/cuda",
]
cutile = ["cuda", "inference-quant/cutile"]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "inference-quant/metal",
    "dep:candle-metal-kernels",
    "dep:inference-paged-attn",
    "inference-paged-attn/metal",
    "dep:objc2-metal"
]
flash-attn = ["cuda", "dep:inference-flash-attn", "inference-flash-attn/cuda"]
flash-attn-v3 = ["cuda", "dep:candle-flash-attn-v3"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "inference-quant/accelerate"]
