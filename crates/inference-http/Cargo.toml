[package]
name = "inference-http"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
description = "HTTP building blocks the inference.rs API server and web UI share: error envelopes, API keys, observability"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
inference-json = { workspace = true, features = ["axum"] }
inference-api.workspace = true
mime.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["tokio"] }
http-body.workspace = true
http-body-util.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
inference-chat-protocols.workspace = true

[features]
# the handlers' OpenAPI path items, which server-core's tests collect into docs/openapi.json
openapi-paths = ["dep:utoipa"]
