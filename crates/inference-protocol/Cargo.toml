[package]
name = "inference-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Wire protocol types, tool-call parsers and reasoning parsers for inference.rs"
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
base64.workspace = true
either.workspace = true
image.workspace = true
indexmap.workspace = true
inference-code-exec = { workspace = true, optional = true }
inference-mcp.workspace = true
llguidance.workspace = true
mime_guess.workspace = true
openai-harmony = "0.0.8"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toktrie.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

[features]
code-execution = ["dep:inference-code-exec"]
utoipa = ["dep:utoipa", "inference-mcp/utoipa"]
