[package]
name = "inference-core"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
inference-protocol.workspace = true
anyhow.workspace = true
inference-tensor.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
dirs.workspace = true
hf-hub.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
chrono.workspace = true
either.workspace = true
indexmap.workspace = true
tracing.workspace = true
rand.workspace = true
regex-automata.workspace = true
galil-seiferas.workspace = true
tokio.workspace = true
tokio-rayon.workspace = true
rand_isaac.workspace = true
futures.workspace = true
indicatif.workspace = true
strum.workspace = true
image.workspace = true
itertools.workspace = true
csv.workspace = true
reqwest.workspace = true
base64.workspace = true
inference-paged-attn = { workspace = true, optional = true }
inference-quant.workspace = true
inference-nn.workspace = true
inference-gguf.workspace = true
inference-models-diffusion.workspace = true
inference-models-gemma = { workspace = true, optional = true }
inference-models-llama = { workspace = true, optional = true }
inference-models-other = { workspace = true, optional = true }
inference-models-phi = { workspace = true, optional = true }
inference-models-qwen = { workspace = true, optional = true }
inference-models-speech.workspace = true
utoipa = { workspace = true, optional = true }
regex.workspace = true
as-any.workspace = true
llguidance.workspace = true
toktrie.workspace = true
safetensors.workspace = true
serde-big-array.workspace = true
interprocess.workspace = true
ahash.workspace = true
inference-audio.workspace = true
inference-mcp = { workspace = true, features = ["utoipa"] }
inference-code-exec.workspace = true
inference-sandbox.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
objc = { workspace = true, optional = true }

[features]
default = ["all-models"]
all-models = ["models-gemma", "models-llama", "models-other", "models-phi", "models-qwen"]
models-gemma = ["dep:inference-models-gemma", "inference-gguf/models-gemma"]
models-llama = ["dep:inference-models-llama"]
models-other = ["dep:inference-models-other"]
models-phi = ["dep:inference-models-phi"]
models-qwen = ["dep:inference-models-qwen"]
cuda = [
    "inference-tensor/cuda",
    "inference-quant/cuda",
    "dep:inference-paged-attn",
    "inference-paged-attn/cuda",
    "inference-nn/cuda",
    "inference-models-diffusion/cuda",
    "inference-models-gemma?/cuda",
    "inference-models-llama?/cuda",
    "inference-models-other?/cuda",
    "inference-models-phi?/cuda",
    "inference-models-qwen?/cuda",
    "inference-models-speech/cuda",
]
cudnn = ["inference-tensor/cudnn"]
cutile = ["cuda", "inference-quant/cutile", "inference-nn/cutile"]
metal = [
    "inference-tensor/metal",
    "inference-quant/metal",
    "dep:objc",
    "dep:inference-paged-attn",
    "inference-paged-attn/metal",
    "inference-nn/metal",
    "inference-models-diffusion/metal",
    "inference-models-gemma?/metal",
    "inference-models-llama?/metal",
    "inference-models-other?/metal",
    "inference-models-phi?/metal",
    "inference-models-qwen?/metal",
    "inference-models-speech/metal",
]
flash-attn-v3 = ["cuda", "inference-nn/flash-attn-v3"]
accelerate = ["inference-tensor/accelerate", "inference-quant/accelerate", "inference-nn/accelerate"]
mkl = ["inference-tensor/mkl"]
nccl = ["cuda", "inference-quant/nccl"]
utoipa = ["dep:utoipa", "inference-protocol/utoipa", "inference-nn/utoipa", "inference-code-exec/utoipa", "inference-sandbox/utoipa"]
ring = ["inference-quant/ring"]
code-execution = ["inference-protocol/code-execution"]

