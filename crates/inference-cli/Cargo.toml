[package]
name = "inference-cli"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
description = "Command-line interface for inference.rs LLM inference"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "inference"

[[bin]]
name = "inference"
path = "src/main.rs"
doc = false

[dependencies]
mimalloc = { workspace = true }
inference-core = { workspace = true }
inference-server-core = { workspace = true }
inference = { workspace = true }
inference-sandbox = { workspace = true }
inference-quant = { workspace = true }
candle-core = { workspace = true }

clap = { workspace = true }
clap_complete = "4.5"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ctrlc = { workspace = true }
rustyline = { workspace = true }
directories = { workspace = true }
axum = { workspace = true, features = ["multipart", "ws"] }
either = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
include_dir = { workspace = true }
mime_guess = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
comfy-table = "7"
dirs = { workspace = true }
walkdir = { workspace = true }
crossterm = "0.28"
fuzzy-matcher = "0.3"

[features]
default = ["code-execution"]
cuda = ["inference-core/cuda", "inference-server-core/cuda"]
cutile = ["cuda", "inference-core/cutile"]
nccl = ["inference-core/nccl", "inference-server-core/nccl"]
cudnn = ["inference-core/cudnn", "inference-server-core/cudnn"]
flash-attn = ["cuda", "inference-core/flash-attn", "inference-server-core/flash-attn"]
flash-attn-v3 = ["cuda", "inference-core/flash-attn-v3", "inference-server-core/flash-attn-v3"]
accelerate = ["inference-core/accelerate", "inference-server-core/accelerate"]
metal = ["inference-core/metal", "inference-server-core/metal"]
mkl = ["inference-core/mkl", "inference-server-core/mkl"]
ring = ["inference-core/ring", "inference-server-core/ring"]
code-execution = ["inference-core/code-execution", "inference-server-core/code-execution"]
