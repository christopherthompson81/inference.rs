[package]
name = "inference-cli"
readme = "../../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
description = "Command-line interface for inference.rs LLM inference"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "inference"

[[bin]]
name = "inference"
path = "src/main.rs"
doc = false

[dependencies]
mimalloc = { workspace = true }
inference-api = { workspace = true }
inference-server-core = { workspace = true }
inference-webui = { workspace = true }
inference-tensor.workspace = true

clap = { workspace = true }
clap_complete = "4.5"
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64.workspace = true
toml = { workspace = true }
ctrlc = { workspace = true }
rustyline = { workspace = true }
regex = { workspace = true }
comfy-table = "7"
uuid = { workspace = true, features = ["v4"] }
dirs = { workspace = true }
walkdir = { workspace = true }
crossterm = "0.29"
fuzzy-matcher = "0.3"

[dev-dependencies]
axum = { workspace = true }
image.workspace = true
indicatif.workspace = true
inference-models-other.workspace = true
inference-nn.workspace = true
inference-quant.workspace = true
rand.workspace = true
rand_distr.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[features]
default = ["code-execution", "swagger-ui", "all-models"]
swagger-ui = ["inference-server-core/swagger-ui"]
all-models = ["inference-api/all-models", "inference-server-core/all-models"]
models-gemma = ["inference-api/models-gemma", "inference-server-core/models-gemma"]
models-llama = ["inference-api/models-llama", "inference-server-core/models-llama"]
models-other = ["inference-api/models-other", "inference-server-core/models-other"]
models-phi = ["inference-api/models-phi", "inference-server-core/models-phi"]
models-qwen = ["inference-api/models-qwen", "inference-server-core/models-qwen"]
cuda = ["inference-api/cuda", "inference-server-core/cuda"]
cutile = ["cuda", "inference-api/cutile"]
nccl = ["inference-api/nccl", "inference-server-core/nccl"]
cudnn = ["inference-api/cudnn", "inference-server-core/cudnn"]
flash-attn-v3 = ["cuda", "inference-api/flash-attn-v3", "inference-server-core/flash-attn-v3"]
accelerate = ["inference-api/accelerate", "inference-server-core/accelerate"]
metal = ["inference-api/metal", "inference-server-core/metal"]
mkl = ["inference-api/mkl", "inference-server-core/mkl"]
ring = ["inference-api/ring", "inference-server-core/ring"]
code-execution = ["inference-api/code-execution", "inference-server-core/code-execution"]
