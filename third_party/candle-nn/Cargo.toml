[package]
name = "candle-nn"
version = "0.11.0"
edition = "2021"
description = "Minimalist ML framework."
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
candle = { path = "../candle-core", package = "candle-core", version = "0.11.0" }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
thiserror = "2"
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
num-traits = "0.2.15"
rayon = "1.7.0"
safetensors = "0.8.0"
serde = { version = "1.0.171", features = ["derive"] }
objc2-metal = { version = "0.3.1", optional = true }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", rev = "e65eb1de3cfe41008fc3acc99ed3f1c72a8d250f", version = "0.11.0", optional = true }
libc = "0.2.147"

[features]
default = []
accelerate = ["dep:accelerate-src", "candle/accelerate"]
cuda = ["candle/cuda"]
cudnn = ["candle/cudnn"]
mkl = ["dep:intel-mkl-src", "candle/mkl"]
metal = ["candle/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
metal-debug-labels = ["metal", "candle/metal-debug-labels"]
