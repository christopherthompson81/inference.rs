[package]
name = "candle-core"
version = "0.11.0"
edition = "2021"
description = "Minimalist ML framework."
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
byteorder = "1.4.3"
candle-kernels = { path = "../candle-kernels", version = "0.11.0", optional = true }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", rev = "e65eb1de3cfe41008fc3acc99ed3f1c72a8d250f", version = "0.11.0", optional = true }
objc2-metal = { version = "0.3.1", optional = true }
objc2-foundation = { version = "0.3.1", optional = true }
cudarc = { version = "0.19.8", features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-loading",
], default-features = false, optional = true }
cutile = { version = "=0.3.1", optional = true }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
libc = "0.2.147"
libm = "0.2.15"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num-traits = "0.2.15"
num_cpus = "1.15.0"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
thiserror = "2"
yoke = { version = "0.8.1", features = ["derive"] }
zerocopy = "0.8"
zip = { version = "8.6.0", default-features = false }
parking_lot = "0.12.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels"]
cutile = ["cuda", "dep:cutile"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]
