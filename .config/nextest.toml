# cargo-nextest runs each test in its own process, so CUDA tests no longer share a context or memory pools.
# Test groups admit tests only while the group has a free slot; everything else keeps running in parallel.

[test-groups]
# Model-backed tests peak at ~2.5 GB of VRAM each (measured with nvidia-smi); 6 of them fit a 24 GB card with ~6 GB
# left for the kernel tests and the desktop. Size this to the card: (VRAM - idle - headroom) / 2.5 GB.
gpu-model = { max-threads = 6 }

# Real-checkpoint parity tests are integration tests: they run on request (`local_ci.sh --models`), not on every cycle.
[profile.default]
default-filter = 'not ((package(inference) & test(/^paddleocr_vl::/)) | (package(inference-ffi) & test(detections)))'

[profile.models]
default-filter = '(package(inference) & test(/^paddleocr_vl::/)) | (package(inference-ffi) & test(detections))'

# The slowest tests start first so the run ends in a burst instead of a tail of a few long tests.
[[profile.default.overrides]]
filter = '(package(inference) & test(/^paddleocr_vl::/)) | (package(inference-ffi) & test(detections))'
priority = 100

# RLIMIT_NPROC counts every thread the concurrently running test processes spawn, so this one runs alone.
[[profile.default.overrides]]
filter = 'package(inference-sandbox) & test(rlimit_nproc_caps_processes)'
threads-required = 'num-test-threads'

# The CUDA suite keeps a greedy parity check and the real-weight ISQ check; the rest, and the CPU layout detection, run on request
# with --models. Engine behavior runs on the tiny random-weight checkpoint in paddleocr_vl_tiny.
[profile.cuda]
default-filter = """
not (
    (
        (package(inference) & test(/^paddleocr_vl::/))
        & not (test(=paddleocr_vl::greedy_ids_match_transformers) | test(=paddleocr_vl::gpu::isq_q8_0_keeps_ocr_text))
    )
    | (package(inference-ffi) & test(detections))
)
"""

[[profile.cuda.overrides]]
filter = '(package(inference) & test(/^paddleocr_vl::/))'
test-group = 'gpu-model'

# Real-weight FLUX takes ~18 GB of VRAM, so it runs alone, first so the rest of the suite follows it.
[[profile.cuda.overrides]]
filter = 'package(inference-server-core) & test(/^flux::/)'
threads-required = 'num-test-threads'
priority = 100
