# cargo-nextest runs each test in its own process, so CUDA tests no longer share a context or memory pools.
# Test groups admit tests only while the group has a free slot; everything else keeps running in parallel.

[test-groups]
# Model-backed tests peak at ~2.5 GB of VRAM each (measured with nvidia-smi); 6 of them fit a 24 GB card with ~6 GB
# left for the kernel tests and the desktop. Size this to the card: (VRAM - idle - headroom) / 2.5 GB.
gpu-model = { max-threads = 6 }

# Metal has no VRAM of its own: the model-backed tests compete with the rest of the suite for the same RAM, and the
# engine sizes its KV budget from whatever is free when it loads. Admit a few at a time so that reading stays sane.
metal-model = { max-threads = 4 }

# Real-checkpoint tests (parity goldens, end-to-end runs on real weights) are deep checks: `scripts/deep_checks.sh` runs
# them on request, and neither the default nor the CUDA profile does. Restated per profile: filters do not carry over.
[profile.default]
default-filter = """
not (
    (package(inference) & test(/^(paddleocr_vl|qwen3_5_mtp|gguf_iq)::/))
    | (package(inference-ffi) & test(detections))
    | (package(inference-server-core) & test(/^flux::/))
)
"""

# RLIMIT_NPROC counts every thread the concurrently running test processes spawn, so this one runs alone.
[[profile.default.overrides]]
filter = 'package(inference-sandbox) & test(rlimit_nproc_caps_processes)'
threads-required = 'num-test-threads'

[profile.cuda]
default-filter = """
not (
    (package(inference) & test(/^(paddleocr_vl|qwen3_5_mtp|gguf_iq)::/))
    | (package(inference-ffi) & test(detections))
    | (package(inference-server-core) & test(/^flux::/))
)
"""

[profile.deep]
default-filter = """
(package(inference) & test(/^(paddleocr_vl|qwen3_5_mtp|gguf_iq)::/))
| (package(inference-ffi) & test(detections))
| (package(inference-server-core) & test(/^flux::/))
"""

[[profile.deep.overrides]]
filter = '(package(inference) & test(/^(paddleocr_vl|qwen3_5_mtp)::/))'
test-group = 'gpu-model'

# The IQ4_XS 27B takes ~15 GB of VRAM and real-weight FLUX ~18 GB, so each runs alone, first.
[[profile.deep.overrides]]
filter = '(package(inference) & test(/^gguf_iq::/)) | (package(inference-server-core) & test(/^flux::/))'
threads-required = 'num-test-threads'
priority = 100

# Metal keeps the default profile's filter; only the memory-hungry tests are held back.
[profile.metal]

[[profile.metal.overrides]]
filter = """
(package(inference) & test(/_tiny::/))
| (package(inference-ffi) & test(/^engine_abi::/))
| (package(inference-server-core) & test(/^chat_route::/))
"""
test-group = 'metal-model'

# Restated per profile: overrides do not carry over from the default profile.
[[profile.metal.overrides]]
filter = 'package(inference-sandbox) & test(rlimit_nproc_caps_processes)'
threads-required = 'num-test-threads'
