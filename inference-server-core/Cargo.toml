[package]
name = "inference-server-core"
readme = "../README.md"
authors = ["Eric Buehler"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["tokio", "multipart"] }
http-body = { workspace = true }
http-body-util.workspace = true
candle-core.workspace = true
chrono.workspace = true
data-url.workspace = true
either.workspace = true
futures.workspace = true
image.workspace = true
indexmap.workspace = true
itertools.workspace = true
base64.workspace = true
inference-core = { workspace = true, features = [
  "utoipa",
] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
url.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"], optional = true }
uuid = { workspace = true, features = ["v4"] }
zip.workspace = true

accelerate-src = { workspace = true, optional = true }
intel-mkl-src = { workspace = true, optional = true }

[features]
default = ["swagger-ui"]
swagger-ui = ["dep:utoipa-swagger-ui"]
cuda = ["inference-core/cuda"]
cudnn = ["inference-core/cudnn"]
metal = ["inference-core/metal"]
flash-attn = ["cuda", "inference-core/flash-attn"]
flash-attn-v3 = ["cuda", "inference-core/flash-attn-v3"]
accelerate = ["inference-core/accelerate"]
mkl = ["inference-core/mkl"]
nccl = ["inference-core/nccl"]
ring = ["inference-core/ring"]
code-execution = ["inference-core/code-execution"]
