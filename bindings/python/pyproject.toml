[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inference_rs"
version = "0.9.3"
description = "inference.rs over its C ABI (libinference_ffi), with no compiled extension"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = ["inference_rs"]
