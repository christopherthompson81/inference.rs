[package]
name = "inference-examples"
description = "Rust SDK examples for inference.rs; built on request, not by routine builds."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autoexamples = false

[dependencies]
inference = { workspace = true }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
walkdir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
rand.workspace = true
either.workspace = true
image.workspace = true
futures.workspace = true
clap.workspace = true

[features]
cuda = ["inference/cuda"]
cutile = ["inference/cutile"]
cudnn = ["inference/cudnn"]
metal = ["inference/metal"]
flash-attn = ["inference/flash-attn"]
accelerate = ["inference/accelerate"]
mkl = ["inference/mkl"]
nccl = ["inference/nccl"]
ring = ["inference/ring"]
code-execution = ["inference/code-execution"]

