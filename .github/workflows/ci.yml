on:
  schedule:
      - cron: '0 0 * * 1'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

name: Continuous integration

# Overriding RUSTFLAGS also drops .cargo/config.toml target-cpu=native, which breaks ring on runner VMs
env:
  RUSTFLAGS: "-D warnings"

# Test Suite runs from tests.yml on demand, and Docs runs locally via scripts/local_ci.sh; both are too slow per PR
jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  check-metal:
    name: Check (metal)
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --features metal

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --tests --examples -- -D warnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typos check with custom config file
        uses: crate-ci/typos@master
        with:
          config: .typos.toml

  doc-links:
    name: Doc Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for docs/*.md links outside docs/
        run: |
          if grep -rn '(docs/[^)]*\.md' --include='*.md' --exclude-dir=docs .; then
            echo "::error::Found docs/*.md links outside docs/ directory. Use https://docs.mistralrs.dev/ URLs instead."
            exit 1
          fi

  # No pinned-MSRV job: CI and release always build with the latest stable toolchain. The MSRV is
  # declared in Cargo.toml (rust-version) and docs, and enforced for source installs by install.sh /
  # install.ps1, which update Rust to meet it.
