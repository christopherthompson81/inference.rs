on:
  schedule:
      - cron: '0 0 * * 1'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

name: Continuous integration

# Overriding RUSTFLAGS also drops .cargo/config.toml target-cpu=native, which breaks ring on runner VMs
env:
  RUSTFLAGS: "-D warnings"

# Caches are saved from master only, so PRs restore master's and do not churn the repo cache limit
# Tests are too slow per PR: they run on master, on the schedule and on dispatch; scripts/local_ci.sh runs them and Docs locally
jobs:
  # Linux and macOS compile under the clippy jobs below; Windows is the one target they miss
  check:
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --tests --examples -- -D warnings

  # The metal-only code paths are invisible to the Linux clippy job
  clippy-metal:
    name: Clippy (metal)
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Shaders are compiled by metal_shaders.yml, only when shader sources or their build config change
      - run: cargo clippy --workspace --tests --examples --features metal -- -D warnings
        env:
          INFERENCE_RS_METAL_PRECOMPILE: "0"

  # The CPU suite as `scripts/local_ci.sh --tests` runs it, guarding master after each merge
  test:
    name: Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # A full test build outgrows the runner's free disk otherwise
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo nextest run --no-fail-fast --workspace --lib --bins --tests
      # nextest does not run doctests
      - run: cargo test --workspace --no-fail-fast --doc
      - run: cargo build --workspace --example text_generation --example streaming --example multimodal_basic

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typos check with custom config file
        uses: crate-ci/typos@v1.50.2
        with:
          config: .typos.toml

  doc-links:
    name: Doc Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for docs/*.md links outside docs/
        run: |
          if grep -rn '(docs/[^)]*\.md' --include='*.md' --exclude-dir=docs .; then
            echo "::error::Found docs/*.md links outside docs/ directory. Use absolute https://github.com/christopherthompson81/inference.rs/blob/master/docs/... URLs instead."
            exit 1
          fi

  # No pinned-MSRV job: CI and release always build with the latest stable toolchain. The MSRV is
  # declared in Cargo.toml (rust-version) and docs, and enforced for source installs by install.sh /
  # install.ps1, which update Rust to meet it.
