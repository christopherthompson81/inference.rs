on:
  workflow_dispatch:

name: Test suite

# Overriding RUSTFLAGS drops .cargo/config.toml target-cpu=native, which breaks ring on runner VMs
env:
  RUSTFLAGS: ""

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test -p inference-core -p inference-nn -p inference-models-llama -p inference-models-qwen -p inference-models-gemma -p inference-models-phi -p inference-models-other -p inference-quant -p inference-vision
        env:
          TESTS_HF_TOKEN: ${{ secrets.HF_TOKEN }}
