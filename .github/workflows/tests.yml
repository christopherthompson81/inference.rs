on:
  workflow_dispatch:

name: Test suite

# Suppress .cargo/config.toml target-cpu=native: ring asserts baseline aes/sha2 on aarch64-apple-darwin, native in runner VMs drops them
env:
  RUSTFLAGS: ""

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        env:
          TESTS_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          command: test
          args: -p inference-core -p inference-quant -p inference-vision
